<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>문의가 접수되었습니다 — 커뮤니티아트랩 발견</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; background: #fff; color: #0A0A0A;
    font-family: "Noto Sans KR", "Malgun Gothic", sans-serif; line-height: 1.8;
    min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px;
  }
  .box { max-width: 480px; text-align: center; }
  h1 { font-family: "Black Han Sans", sans-serif; font-weight: 400; font-size: clamp(1.8rem, 6vw, 2.6rem); margin: 24px 0 14px; }
  h1 .dot { color: #002FA7; }
  p { color: #555; margin: 0 0 28px; font-size: 0.95rem; }
  a {
    display: inline-block; text-decoration: none; font-weight: 700; font-size: 0.9rem;
    padding: 14px 28px; border: 2px solid #0A0A0A; color: #0A0A0A; letter-spacing: 0.06em;
  }
  a:hover { background: #0A0A0A; color: #fff; }
</style>
</head>
<body>
  <div class="box">
    <svg width="64" height="64" viewBox="0 0 100 100" aria-hidden="true">
      <g fill="#0A0A0A">
        <circle cx="50" cy="14" r="8"/><circle cx="75.5" cy="24.5" r="8"/><circle cx="86" cy="50" r="8"/><circle cx="75.5" cy="75.5" r="8"/><circle cx="50" cy="86" r="8"/><circle cx="24.5" cy="75.5" r="8"/><circle cx="14" cy="50" r="8"/>
      </g>
      <circle cx="24.5" cy="24.5" r="8" fill="none" stroke="#002FA7" stroke-width="3.6"/>
    </svg>
    <h1>문의가 접수되었습니다<span class="dot">.</span></h1>
    <p>보내주신 내용을 잘 받았습니다.<br>확인 후 이메일 또는 전화로 회신드리겠습니다.</p>
    <a href="/">홈으로 돌아가기</a>
  </div>
</body>
</html>
